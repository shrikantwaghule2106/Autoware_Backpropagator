[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adviewer"
dynamic = ["version"]
description = "Visual explorer and mapping assistant for the Autoware Universe ROS 2 architecture"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shrikant Waghule" }]
keywords = ["autoware", "ros2", "architecture", "static-analysis", "diagnostics", "carla", "dds"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.14.1",
  "networkx>=3.4.2",
  "pyyaml>=6.0.3",
  "fastapi>=0.147.0",
  "uvicorn[standard]>=0.54.0",
  "typer>=0.27.3",
  "scipy>=1.15.3",
  "numpy>=2.2.6",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.17.1", "mypy>=2.4.0", "httpx>=0.28.1", "types-PyYAML", "types-networkx",
       "jsonschema>=4.26.0", "pre-commit>=4.6.2"]

[project.urls]
Homepage = "https://github.com/shrikantwaghule2106/Autoware_Backpropagator"
Issues = "https://github.com/shrikantwaghule2106/Autoware_Backpropagator/issues"
Releases = "https://github.com/shrikantwaghule2106/Autoware_Backpropagator/releases"

[project.scripts]
adviewer = "adviewer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "adviewer.__version__" }  # the one place the version lives

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adviewer = ["ui/static/*", "ui/static/assets/*", "data/*.yaml", "data/*/*.yaml", "data/schema/*.json", "probe/Dockerfile", "probe/README.md", "probe/*.xml", "probe/cpp/*", "probe/cpp/src/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI options as argument defaults; that is its documented idiom
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[[tool.mypy.overrides]]
module = ["scipy.*", "rclpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["adviewer"]

[tool.coverage.report]
fail_under = 85
skip_covered = true
show_missing = true
