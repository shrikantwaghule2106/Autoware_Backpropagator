# Lint, tests and type checks on Linux, Windows and macOS (the core is pure Python); the UI build;
# the C++ probe built and measuring on five ROS 2 distributions; Online mode end to end in Docker.
# Weekly as well, to catch changes in the ROS images and in dependencies.
name: ci
on:
  push:
    branches: [main, dev]   # other branches are tested through their pull request (not twice)
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-target:
    name: pull requests go to dev
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: only this repository's dev branch is merged into main
        if: github.head_ref != 'dev' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Please open the pull request against the dev branch: main is the release branch."
          exit 1
      - run: echo "dev into main"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - run: python -m pip install -e ".[dev]"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit (YAML/JSON/TOML/XML, whitespace, private keys, ruff, shellcheck, hadolint, codespell)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: cppcheck (probe)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
          cppcheck --enable=warning,performance,portability --std=c++17 --inline-suppr --error-exitcode=1 \
            --suppress=missingIncludeSystem --quiet src/adviewer/probe/cpp/src

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: pyproject.toml }
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - name: pytest (coverage measured on Linux / Python 3.12)
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.12') }}
        run: pytest -q
      - name: pytest with coverage (at least 85 %)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' }}
        run: |
          pytest -q --cov --cov-report=term
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: committed build is up to date
        run: git diff --exit-code -- ../src/adviewer/ui/static

  probe:
    name: probe on ROS 2 ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy, kilted, lyrical, rolling]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - run: python -m pip install -e ".[dev]"
      - name: build the probe on ros:${{ matrix.distro }} and measure a publisher with it
        env: { ADVIEWER_E2E: "1", ADVIEWER_E2E_DISTRO: "${{ matrix.distro }}" }
        run: pytest -q tests/e2e -k another_ros_distribution

  online:
    name: Online mode end to end (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - run: python -m pip install -e ".[dev]"
      - name: default probe, --like across networks and DDS settings, Fast DDS, recording, stopping
        env: { ADVIEWER_E2E: "1" }
        run: pytest -q tests/e2e
