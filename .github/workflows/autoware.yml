# Weekly and on demand, for every Autoware release adviewer has data for: read the release from
# its source (`adviewer fetch-source`, no Docker image) and run the acceptance tests on it. And
# watch Autoware's releases: a new one without adviewer data opens an issue with the steps.
name: autoware releases
on:
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:
permissions: { contents: read }

jobs:
  releases:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        name: the releases in src/adviewer/data
        run: |
          list=$(python3 -c "import json, pathlib; print(json.dumps(sorted(p.name.removeprefix('autoware-') for p in pathlib.Path('src/adviewer/data').glob('autoware-*') if (p / 'release.yaml').is_file())))")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "releases: $list"

  acceptance:
    name: Autoware ${{ matrix.release }}
    needs: releases
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.releases.outputs.list) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - run: python -m pip install -e ".[dev]"
      - name: the release's source at its tags (adviewer fetch-source)
        run: |
          adviewer fetch-source --release "${{ matrix.release }}" --out "$RUNNER_TEMP/autoware/src"
          test -d "$RUNNER_TEMP/autoware/src/launcher/autoware_launch"
      - name: acceptance tests on it
        env:
          ADVIEWER_AUTOWARE_RELEASE: ${{ matrix.release }}
          ADVIEWER_AUTOWARE_TREE: ${{ runner.temp }}/autoware
        run: pytest -q -rs tests/test_acceptance_real.py

  watch:
    name: a new Autoware release
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: write }
    steps:
      - uses: actions/checkout@v5
      - name: open an issue when Autoware has a release adviewer has no data for
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          latest=$(gh api repos/autowarefoundation/autoware/releases/latest --jq .tag_name)
          echo "Autoware's latest release: $latest"
          if [ -d "src/adviewer/data/autoware-$latest" ]; then echo "adviewer has data for it"; exit 0; fi
          title="Autoware $latest: add its release data"
          if [ "$(gh issue list --state open --search "in:title $title" --json number --jq length)" != "0" ]; then
            echo "an issue is open already"; exit 0
          fi
          cat > body.md <<EOF
          Autoware **$latest** is out and adviewer has no data for it yet. Steps (README → Contributing → A new Autoware release):

          - [ ] \`src/adviewer/data/autoware-$latest/release.yaml\`: release, image, image size, \`detect\`, \`source_repos\` from Autoware's \`repositories/autoware.repos\` at tag $latest
          - [ ] \`adviewer fetch-source --release $latest --out /tmp/aw-$latest/src\`
          - [ ] \`layers.yaml\`: copy the previous release's, then \`adviewer layer-table --source-root /tmp/aw-$latest/src --release $latest\`
          - [ ] \`mrm.yaml\`, \`topic_params.yaml\`: check every cited file:line in this release's source; \`subsystems.yaml\`, \`aliases.yaml\`
          - [ ] \`ADVIEWER_AUTOWARE_RELEASE=$latest ADVIEWER_AUTOWARE_TREE=/tmp/aw-$latest pytest tests/test_acceptance_real.py\`
          - [ ] the README's compatibility table
          EOF
          gh issue create --title "$title" --body-file body.md
