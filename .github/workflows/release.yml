# A tag vX.Y.Z (equal to adviewer.__version__) builds the wheel and the source archive, checks
# that they carry the UI, the probe and the data, installs the wheel in a clean environment, and
# publishes a GitHub release. PyPI is optional: set the repository variable PUBLISH_PYPI=true after
# adding this repository as a trusted publisher on pypi.org.
name: release
on:
  push:
    tags: ["v*"]
permissions: { contents: read }

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: the tag is the package version
        run: |
          version="$(python -c 'import re, pathlib; print(re.search(r"__version__ = \"(.+?)\"", pathlib.Path("src/adviewer/__init__.py").read_text()).group(1))')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME is not the package version v$version"; exit 1; }
      - run: python -m pip install build && python -m build
      - name: the wheel carries the UI, the probe sources and the data
        run: |
          python -m zipfile -l dist/*.whl > files.txt
          for f in ui/static/index.html probe/Dockerfile probe/cpp/src/probe.cpp \
                   probe/fastdds_udp.xml data/schema/release.schema.json data/target.example.yaml; do
            grep -q "adviewer/$f" files.txt || { echo "missing in the wheel: $f"; exit 1; }
          done
      - name: install the wheel in a clean environment and run it
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/adviewer --version
          /tmp/clean/bin/adviewer --help > /dev/null
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - name: publish the GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

  pypi:
    needs: build
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    runs-on: ubuntu-24.04
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
