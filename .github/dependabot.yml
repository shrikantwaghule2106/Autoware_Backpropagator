# Weekly update pull requests for Python and UI dependencies and for the CI actions, into dev.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    target-branch: dev   # main only receives dev, through a pull request
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: "/ui"
    target-branch: dev   # main only receives dev, through a pull request
    schedule: { interval: weekly }
    groups: { ui: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev   # main only receives dev, through a pull request
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
