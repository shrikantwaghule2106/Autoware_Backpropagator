# Monthly update pull requests into dev (main only receives dev, through a pull request).
# Minor and patch updates come grouped; a major version (React, TypeScript, an action) comes in
# its own pull request, to be checked on its own. Python: our ranges are `>=`, so CI already
# installs the newest releases on every run; a pull request opens only when a release falls
# outside a range (and for security updates).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    target-branch: dev
    schedule: { interval: monthly }
    versioning-strategy: increase-if-necessary
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: "/ui"
    target-branch: dev
    schedule: { interval: monthly }
    groups:
      # React and its types move together, majors too: alone, react and react-dom do not build
      react: { patterns: ["react", "react-dom", "@types/react", "@types/react-dom"] }
      ui: { patterns: ["*"], update-types: ["minor", "patch"] }
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"], update-types: ["minor", "patch"] } }
