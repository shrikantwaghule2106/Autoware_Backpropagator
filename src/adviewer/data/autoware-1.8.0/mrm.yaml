# How a Minimal Risk Maneuver (MRM) is triggered at this release. Checked 2026-10-22 in the 1.8.0
# source (`adviewer fetch-source --release 1.8.0`; paths relative to it): mrm_handler_core.cpp and
# command_mode_mapping.cpp are identical to 1.9.0's, so the cited lines hold; the mode numbers
# (autoware_launch config/system/command_mode/converter.param.yaml) and the chain topics are the same.
aggregator_package: autoware_diagnostic_graph_aggregator
mode_mappings_param: command_mode_mappings   # "{mode: 1002, path: /autoware/modes/autonomous}"
mode_names: {1001: stop, 1002: autonomous, 1003: local, 1004: remote, 2001: emergency_stop, 2002: comfortable_stop, 2003: pull_over}
availability_rule: a mode is available only if its diagnostic unit's level is exactly OK
availability_evidence: universe/autoware_universe/system/autoware_diagnostic_graph_aggregator/src/node/command_mode_mapping.cpp (item.available = unit->level() == OK)
handler_package: autoware_mrm_handler
trigger_mode: autonomous
trigger_rule: MRM starts when the current operation mode is not available, an emergency is held, or the availability message times out
trigger_evidence: universe/autoware_universe/system/autoware_mrm_handler/src/mrm_handler/mrm_handler_core.cpp:558-561
behaviour_rule: pull_over if available and use_pull_over; else comfortable_stop if available and use_comfortable_stop; else emergency_stop
behaviour_evidence: universe/autoware_universe/system/autoware_mrm_handler/src/mrm_handler/mrm_handler_core.cpp:474-492
chain: [/system/command_mode/availability, /system/operation_mode/availability, /system/fail_safe/mrm_state]
